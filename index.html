<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simplified Engine Assembly VR</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #0b0e13; }
  a-scene { width: 100vw; height: 100vh; }

  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 5;
    background: rgba(10,14,20,0.75); color: #e7ecf3;
    padding: 12px 16px; border-radius: 10px;
    font: 13px/1.55 'Segoe UI', Arial, sans-serif;
    border: 1px solid rgba(255,170,84,0.35);
    max-width: 250px; pointer-events: none;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  #hud .title { color: #ffb454; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 4px; }
  #hud.hidden { display: none; }

  .a-enter-vr { z-index: 6 !important; }
</style>
</head>
<body>

<div id="hud">
  <div class="title">DESKTOP CONTROLS</div>
  <div>Look &nbsp;— drag mouse</div>
  <div>Move &nbsp;— WASD / arrow keys</div>
  <div>Interact — click, E, or Space</div>
  <div>Rotate held part — R</div>
  <hr style="border-color: rgba(255,255,255,0.12); margin: 8px 0;">
  <div class="title">META QUEST 3S</div>
  <div>Point controller, pull Trigger or Grip to grab, place, or press a button.</div>
</div>

<a-scene background="color: #12161d" renderer="antialias: true; colorManagement: true; foveationLevel: 1" vr-mode-ui="enabled: true" app-manager>

  <!-- ===================== ENVIRONMENT ===================== -->
  <a-plane id="floor" rotation="-90 0 0" width="14" height="14" material="color: #1b212b; shader: flat; roughness: 1"></a-plane>
  <a-plane id="wallBack" position="0 3 -3.6" width="14" height="6" material="color: #232b36; shader: flat; side: double"></a-plane>
  <a-plane id="wallLeft" position="-5.5 3 0" rotation="0 90 0" width="10" height="6" material="color: #1f2733; shader: flat; side: double"></a-plane>
  <a-plane id="wallRight" position="5.5 3 0" rotation="0 -90 0" width="10" height="6" material="color: #1f2733; shader: flat; side: double"></a-plane>

  <!-- Lights (minimal, cheap) -->
  <a-entity light="type: ambient; color: #8b93a3; intensity: 0.6"></a-entity>
  <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="2 4 2"></a-entity>
  <a-entity light="type: point; color: #ffb454; intensity: 0.55; distance: 7" position="0 2.5 -1.3"></a-entity>

  <!-- ===================== PLAYER RIG ===================== -->
  <a-entity id="rig" position="0 0 1.5">
    <a-entity id="camera"
      camera="active: true"
      position="0 1.65 0"
      look-controls
      wasd-controls="acceleration: 18"
      raycaster="objects: .interactive; far: 14">
      <a-ring id="reticle" radius-inner="0.005" radius-outer="0.011" position="0 0 -0.65" material="color: #ffb454; shader: flat"></a-ring>
    </a-entity>

    <a-entity id="leftHand" class="hand"
      hand-controls="hand: left; handModelStyle: lowPoly; color: #3d7291"
      meta-touch-controls="hand: left; model: false"
      raycaster="objects: .interactive; far: 9"
      line="color: #59c6e0; opacity: 0.55">
    </a-entity>

    <a-entity id="rightHand" class="hand"
      hand-controls="hand: right; handModelStyle: lowPoly; color: #3d7291"
      meta-touch-controls="hand: right; model: false"
      raycaster="objects: .interactive; far: 9"
      line="color: #59c6e0; opacity: 0.55">
    </a-entity>
  </a-entity>

  <!-- ===================== ENGINE ASSEMBLY AREA (hidden until Start) ===================== -->
  <a-entity id="engineArea" visible="false">
    <a-box id="workbench" position="0 0.5 -1.3" width="1.7" height="1.0" depth="0.9" material="color: #3b3226; shader: flat"></a-box>
    <a-box id="platform" position="0 1.08 -1.3" width="0.62" height="0.16" depth="0.42" material="color: #22252a; shader: flat"></a-box>
    <a-box id="trayShelf" position="0 0.9 -0.65" width="4.0" height="0.06" depth="0.36" material="color: #5a4a35; shader: flat"></a-box>

    <a-entity id="partsContainer"></a-entity>

    <!-- Floating tutorial / instruction panel -->
    <a-entity id="tutorialPanel" visible="false" position="0 2.35 -1.9">
      <a-plane width="1.7" height="0.75" material="color: #0f141c; shader: flat; opacity: 0.9"></a-plane>
      <a-text id="panelStep" value="" align="center" color="#ffb454" width="2.6" wrap-count="30" position="0 0.24 0.01"></a-text>
      <a-text id="panelInstr" value="" align="center" color="#e7ecf3" width="2.3" wrap-count="42" position="0 0.02 0.01"></a-text>
      <a-text id="panelProgress" value="" align="center" color="#8fa0b5" width="2.1" wrap-count="30" position="0 -0.19 0.01"></a-text>
      <a-text id="panelFeedback" value="" align="center" color="#8be08b" width="2.3" wrap-count="34" position="0 -0.32 0.01"></a-text>
    </a-entity>

    <!-- Small reference diagram of the finished engine -->
    <a-entity id="diagramAnchor" position="1.35 2.15 -1.85">
      <a-plane width="0.85" height="0.95" material="color: #0f141c; shader: flat; opacity: 0.85"></a-plane>
      <a-text value="REFERENCE" align="center" color="#ffb454" width="2.4" position="0 0.4 0.01"></a-text>
      <a-text value="Full assembly" align="center" color="#8fa0b5" width="2.0" position="0 0.32 0.01"></a-text>
      <a-entity id="miniDiagram" position="0 0 0.06"></a-entity>
    </a-entity>
  </a-entity>

  <!-- ===================== START SCREEN ===================== -->
  <a-entity id="startPanel" position="0 1.7 -1.9">
    <a-plane width="2.0" height="1.2" material="color: #0f141c; shader: flat; opacity: 0.94"></a-plane>
    <a-text class="panel-title" value="SIMPLIFIED ENGINE ASSEMBLY" align="center" color="#ffb454" width="2.7" wrap-count="24" position="0 0.37 0.01"></a-text>
    <a-text class="panel-subtitle" value="Learn how to assemble a basic car engine in VR." align="center" color="#e7ecf3" width="2.2" wrap-count="34" position="0 0.15 0.01"></a-text>
    <a-entity id="startButtons" position="0 -0.28 0.01"></a-entity>
  </a-entity>

  <!-- ===================== COMPLETION SCREEN ===================== -->
  <a-entity id="completionPanel" visible="false" position="0 1.9 -1.9">
    <a-plane width="2.0" height="1.2" material="color: #0f141c; shader: flat; opacity: 0.94"></a-plane>
    <a-text class="panel-title" value="ENGINE ASSEMBLY COMPLETE!" align="center" color="#8be08b" width="2.7" wrap-count="24" position="0 0.37 0.01"></a-text>
    <a-text class="panel-subtitle" value="Congratulations! You assembled the simplified engine." align="center" color="#e7ecf3" width="2.2" wrap-count="34" position="0 0.15 0.01"></a-text>
    <a-entity id="completionButtons" position="0 -0.28 0.01"></a-entity>
  </a-entity>

</a-scene>

<script>
(function () {
  'use strict';

  var BENCH_Z = -1.3;

  // ---------------------------------------------------------------
  // Part configuration — single source of truth for every component.
  // Each part is a single simplified primitive shape (per spec: no
  // realistic engineering-level geometry).
  // ---------------------------------------------------------------
  var PARTS = [
    {
      id: 'block', name: 'Engine Block',
      instruction: 'Pick up the engine block and place it on the assembly platform.',
      geo: { tag: 'a-box', width: 0.5, height: 0.35, depth: 0.32 },
      color: '#7a828d',
      tray: { x: -1.75, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.335, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.30
    },
    {
      id: 'crank', name: 'Crankshaft',
      instruction: 'Pick up the crankshaft and place it inside the engine block.',
      geo: { tag: 'a-cylinder', radius: 0.045, height: 0.42 },
      color: '#c7ccd1',
      tray: { x: -1.4, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.22, z: BENCH_Z }, rot: { x: 0, y: 0, z: 90 },
      snap: 0.24
    },
    {
      id: 'rods', name: 'Connecting Rods',
      instruction: 'Pick up the connecting rods and attach them to the crankshaft.',
      geo: { tag: 'a-box', width: 0.32, height: 0.08, depth: 0.1 },
      color: '#9aa1a9',
      tray: { x: -1.05, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.30, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.22
    },
    {
      id: 'pistons', name: 'Pistons',
      instruction: 'Pick up the pistons and slide them into the cylinders.',
      geo: { tag: 'a-cylinder', radius: 0.09, height: 0.14 },
      color: '#f2a541',
      tray: { x: -0.7, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.42, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.22
    },
    {
      id: 'head', name: 'Cylinder Head',
      instruction: 'Pick up the cylinder head and place it on top of the engine block.',
      geo: { tag: 'a-box', width: 0.5, height: 0.16, depth: 0.3 },
      color: '#3f7fd1',
      tray: { x: -0.35, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.59, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.28
    },
    {
      id: 'valvecover', name: 'Valve Cover',
      instruction: 'Pick up the valve cover and place it on top of the cylinder head.',
      geo: { tag: 'a-box', width: 0.4, height: 0.09, depth: 0.22 },
      color: '#2a5aa0',
      tray: { x: 0, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.715, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.24
    },
    {
      id: 'sparkplugs', name: 'Spark Plugs',
      instruction: 'Pick up the spark plugs and insert them into the valve cover.',
      geo: { tag: 'a-cylinder', radius: 0.025, height: 0.18 },
      color: '#e24b4b',
      tray: { x: 0.35, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.80, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.20
    },
    {
      id: 'oilpan', name: 'Oil Pan',
      instruction: 'Pick up the oil pan and attach it beneath the engine block.',
      geo: { tag: 'a-box', width: 0.42, height: 0.12, depth: 0.26 },
      color: '#565d66',
      tray: { x: 0.7, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.10, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.26
    },
    {
      id: 'intake', name: 'Intake Manifold',
      instruction: 'Pick up the intake manifold and attach it to the right side of the engine.',
      geo: { tag: 'a-box', width: 0.18, height: 0.12, depth: 0.4 },
      color: '#3fa66b',
      tray: { x: 1.05, y: 0.98, z: -0.65 },
      target: { x: 0.34, y: 1.59, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.24
    },
    {
      id: 'exhaust', name: 'Exhaust Manifold',
      instruction: 'Pick up the exhaust manifold and attach it to the left side of the engine.',
      geo: { tag: 'a-box', width: 0.18, height: 0.12, depth: 0.4 },
      color: '#6b4630',
      tray: { x: 1.4, y: 0.98, z: -0.65 },
      target: { x: -0.34, y: 1.59, z: BENCH_Z }, rot: { x: 0, y: 0, z: 0 },
      snap: 0.24
    },
    {
      id: 'bolts', name: 'Bolts',
      instruction: 'Pick up the bolts and secure the engine assembly.',
      geo: { tag: 'a-cylinder', radius: 0.05, height: 0.05, segmentsRadial: 6 },
      color: '#e0b23c',
      tray: { x: 1.75, y: 0.98, z: -0.65 },
      target: { x: 0, y: 1.60, z: -1.14 }, rot: { x: 90, y: 0, z: 0 },
      snap: 0.22
    }
  ];

  // ---------------------------------------------------------------
  // Reusable builders
  // ---------------------------------------------------------------
  function setGeo(el, geo) {
    Object.keys(geo).forEach(function (k) {
      if (k !== 'tag') el.setAttribute(k, geo[k]);
    });
  }

  function buildParts(container) {
    PARTS.forEach(function (p) {
      var el = document.createElement(p.geo.tag);
      setGeo(el, p.geo);
      el.setAttribute('material', 'color: ' + p.color + '; metalness: 0.12; roughness: 0.7; emissive: ' + p.color + '; emissiveIntensity: 0');
      el.setAttribute('position', p.tray.x + ' ' + p.tray.y + ' ' + p.tray.z);
      el.id = 'part-' + p.id;
      el.classList.add('part');
      el.dataset.locked = 'false';
      el.dataset.active = 'false';
      container.appendChild(el);
      p.el = el;

      var ghost = document.createElement(p.geo.tag);
      setGeo(ghost, p.geo);
      ghost.setAttribute('material', 'color: ' + p.color + '; opacity: 0.28; transparent: true; shader: flat');
      ghost.setAttribute('position', p.target.x + ' ' + p.target.y + ' ' + p.target.z);
      ghost.setAttribute('rotation', p.rot.x + ' ' + p.rot.y + ' ' + p.rot.z);
      ghost.setAttribute('visible', 'false');
      container.appendChild(ghost);
      p.ghostEl = ghost;

      p.targetVec = new THREE.Vector3(p.target.x, p.target.y, p.target.z);
      p.targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
        THREE.MathUtils.degToRad(p.rot.x),
        THREE.MathUtils.degToRad(p.rot.y),
        THREE.MathUtils.degToRad(p.rot.z)
      ));
      p.trayVec = new THREE.Vector3(p.tray.x, p.tray.y, p.tray.z);
    });
  }

  function buildMiniDiagram(container) {
    var scale = 0.22;
    var refCenter = { x: 0, y: 1.5, z: -1.3 };
    PARTS.forEach(function (p) {
      var el = document.createElement(p.geo.tag);
      setGeo(el, p.geo);
      el.setAttribute('material', 'color: ' + p.color + '; opacity: 0.95; shader: flat');
      var lx = (p.target.x - refCenter.x) * scale;
      var ly = (p.target.y - refCenter.y) * scale;
      var lz = (p.target.z - refCenter.z) * scale;
      el.setAttribute('position', lx + ' ' + ly + ' ' + lz);
      el.setAttribute('rotation', p.rot.x + ' ' + p.rot.y + ' ' + p.rot.z);
      el.setAttribute('scale', scale + ' ' + scale + ' ' + scale);
      container.appendChild(el);
    });
  }

  function makeButton(action, label, x, color) {
    var group = document.createElement('a-entity');
    group.setAttribute('position', x + ' 0 0');

    var plane = document.createElement('a-plane');
    plane.setAttribute('width', 0.86);
    plane.setAttribute('height', 0.3);
    plane.setAttribute('material', 'color: ' + color + '; shader: flat; opacity: 0.95');
    plane.classList.add('ui-button');
    plane.dataset.action = action;

    var text = document.createElement('a-text');
    text.setAttribute('value', label);
    text.setAttribute('align', 'center');
    text.setAttribute('color', '#ffffff');
    text.setAttribute('width', 2.0);
    text.setAttribute('position', '0 0 0.01');

    plane.appendChild(text);
    group.appendChild(plane);
    return group;
  }

  function buildPanelButtons(container, defs) {
    defs.forEach(function (d) {
      container.appendChild(makeButton(d.action, d.label, d.x, d.color));
    });
  }

  // ---------------------------------------------------------------
  // Main app manager component
  // ---------------------------------------------------------------
  AFRAME.registerComponent('app-manager', {
    init: function () {
      var self = this;

      buildParts(document.getElementById('partsContainer'));
      buildMiniDiagram(document.getElementById('miniDiagram'));

      this.cameraEl = document.getElementById('camera');
      this.leftHand = document.getElementById('leftHand');
      this.rightHand = document.getElementById('rightHand');
      this.reticle = document.getElementById('reticle');
      this.hud = document.getElementById('hud');

      this.startPanel = document.getElementById('startPanel');
      this.completionPanel = document.getElementById('completionPanel');
      this.tutorialPanel = document.getElementById('tutorialPanel');
      this.engineArea = document.getElementById('engineArea');

      this.panelStepEl = document.getElementById('panelStep');
      this.panelInstrEl = document.getElementById('panelInstr');
      this.panelProgressEl = document.getElementById('panelProgress');
      this.panelFeedbackEl = document.getElementById('panelFeedback');

      buildPanelButtons(document.getElementById('startButtons'), [
        { action: 'start', label: 'START\nSIMULATION', x: -0.5, color: '#2f7d4f' },
        { action: 'exit', label: 'EXIT', x: 0.5, color: '#7a3535' }
      ]);
      buildPanelButtons(document.getElementById('completionButtons'), [
        { action: 'restart', label: 'RESTART', x: -0.5, color: '#2a5aa0' },
        { action: 'end', label: 'END\nSIMULATION', x: 0.5, color: '#7a3535' }
      ]);
      this.showPanelButtons(this.startPanel, true);

      this.heldPart = null;
      this.heldBy = null;
      this.currentStepIndex = -1;
      this._wasReady = false;
      this._fbTimer = null;

      this.bindInteraction();

      var sceneEl = this.el;
      sceneEl.addEventListener('enter-vr', function () {
        self.reticle.setAttribute('visible', false);
        self.hud.classList.add('hidden');
      });
      sceneEl.addEventListener('exit-vr', function () {
        self.reticle.setAttribute('visible', true);
        self.hud.classList.remove('hidden');
      });
    },

    // ---------------- input binding ----------------
    bindInteraction: function () {
      var self = this;

      this.leftHand.addEventListener('triggerdown', function () { self.handleActivate(self.leftHand); });
      this.rightHand.addEventListener('triggerdown', function () { self.handleActivate(self.rightHand); });
      this.leftHand.addEventListener('gripdown', function () { self.handleActivate(self.leftHand); });
      this.rightHand.addEventListener('gripdown', function () { self.handleActivate(self.rightHand); });

      window.addEventListener('keydown', function (e) {
        if (e.repeat) return;
        if (e.code === 'Space' || e.code === 'KeyE') {
          e.preventDefault();
          self.handleActivate(self.cameraEl);
        } else if (e.code === 'KeyR') {
          self.rotateHeldByCamera();
        }
      });

      window.addEventListener('mousedown', function (e) {
        if (e.target && e.target.tagName === 'CANVAS' && !self.el.is('vr-mode')) {
          self.handleActivate(self.cameraEl);
        }
      });
    },

    // ---------------- per-frame follow ----------------
    tick: function () {
      if (!this.heldPart) return;
      var part = PARTS.filter(function (p) { return p.el === this.heldPart; }, this)[0];
      if (!part) return;

      var holder = this.heldBy;
      var pos = new THREE.Vector3();
      var quat = new THREE.Quaternion();
      holder.object3D.getWorldQuaternion(quat);
      holder.object3D.getWorldPosition(pos);

      var dir = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
      var carryDist = (holder === this.cameraEl) ? 0.55 : 0.14;
      pos.addScaledVector(dir, carryDist);

      this.heldPart.object3D.position.copy(pos);
      if (holder !== this.cameraEl) {
        this.heldPart.object3D.quaternion.copy(quat);
      }

      var distToTarget = pos.distanceTo(part.targetVec);
      var ready = distToTarget <= part.snap;
      if (ready !== this._wasReady) {
        part.ghostEl.setAttribute('material', 'color', ready ? '#7CFF9E' : part.color);
        this.heldPart.setAttribute('material', 'emissiveIntensity', ready ? 0.85 : 0.5);
        this._wasReady = ready;
      }
    },

    // ---------------- interaction dispatch ----------------
    handleActivate: function (sourceEl) {
      if (this.heldPart) {
        if (this.heldBy === sourceEl) this.releaseHeldPart();
        return;
      }
      var rc = sourceEl.components && sourceEl.components.raycaster;
      if (!rc) return;
      var hit = rc.intersectedEls && rc.intersectedEls[0];
      if (!hit) return;

      if (hit.classList.contains('ui-button')) {
        this.runButtonAction(hit.dataset.action);
        return;
      }
      if (hit.classList.contains('part') && hit.dataset.active === 'true' && hit.dataset.locked !== 'true') {
        this.grabPart(hit, sourceEl);
      }
    },

    grabPart: function (el, sourceEl) {
      this.heldPart = el;
      this.heldBy = sourceEl;
      this._wasReady = false;
      el.removeAttribute('animation__pulse');
      el.setAttribute('scale', '1 1 1');
      el.setAttribute('material', 'emissiveIntensity', 0.5);
    },

    releaseHeldPart: function () {
      var el = this.heldPart;
      var part = PARTS.filter(function (p) { return p.el === el; })[0];
      this.heldPart = null;
      this.heldBy = null;

      var pos = new THREE.Vector3();
      el.object3D.getWorldPosition(pos);
      var dist = pos.distanceTo(part.targetVec);

      if (dist <= part.snap) {
        el.object3D.position.copy(part.targetVec);
        el.object3D.quaternion.copy(part.targetQuat);
        this.lockPart(part);
      } else {
        el.setAttribute('material', 'emissiveIntensity', 0.2);
        el.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.07 1.07 1.07; dir: alternate; loop: true; dur: 750; easing: easeInOutSine');
        part.ghostEl.setAttribute('material', 'color', part.color);
        this.showFeedback('Not quite — try again!');
      }
    },

    rotateHeldByCamera: function () {
      if (!this.heldPart || this.heldBy !== this.cameraEl) return;
      this.heldPart.object3D.rotateY(Math.PI / 2);
    },

    lockPart: function (part) {
      part.el.dataset.locked = 'true';
      part.el.dataset.active = 'false';
      part.el.classList.remove('interactive');
      part.el.removeAttribute('animation__pulse');
      part.el.setAttribute('scale', '1 1 1');
      part.el.setAttribute('material', 'emissiveIntensity', 0);
      part.ghostEl.setAttribute('visible', false);
      this.showFeedback('Step complete!  ✓');
      this.advanceStep();
    },

    // ---------------- tutorial flow ----------------
    activateStep: function (index) {
      this.currentStepIndex = index;
      if (index >= PARTS.length) {
        this.showCompletion();
        return;
      }
      var part = PARTS[index];
      part.el.classList.add('interactive');
      part.el.dataset.active = 'true';
      part.el.setAttribute('material', 'emissiveIntensity', 0.2);
      part.el.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.07 1.07 1.07; dir: alternate; loop: true; dur: 750; easing: easeInOutSine');
      part.ghostEl.setAttribute('visible', true);
      part.ghostEl.setAttribute('material', 'color', part.color);
      this.updatePanel(part, index);
    },

    advanceStep: function () {
      var idx = this.currentStepIndex;
      var self = this;
      setTimeout(function () { self.activateStep(idx + 1); }, 600);
    },

    updatePanel: function (part, index) {
      this.panelStepEl.setAttribute('value', 'STEP ' + (index + 1) + ' — ' + part.name.toUpperCase());
      this.panelInstrEl.setAttribute('value', part.instruction);
      this.panelProgressEl.setAttribute('value', 'Step ' + (index + 1) + ' of ' + PARTS.length);
      this.panelFeedbackEl.setAttribute('value', '');
    },

    showFeedback: function (msg) {
      var self = this;
      this.panelFeedbackEl.setAttribute('value', msg);
      clearTimeout(this._fbTimer);
      this._fbTimer = setTimeout(function () { self.panelFeedbackEl.setAttribute('value', ''); }, 1700);
    },

    showCompletion: function () {
      this.tutorialPanel.setAttribute('visible', false);
      this.completionPanel.setAttribute('visible', true);
      this.showPanelButtons(this.completionPanel, true);
    },

    // ---------------- UI button actions ----------------
    runButtonAction: function (action) {
      if (action === 'start') this.onStart();
      else if (action === 'exit') this.onExit();
      else if (action === 'restart') this.onRestart();
      else if (action === 'end') this.onEnd();
    },

    onStart: function () {
      this.showPanelButtons(this.startPanel, false);
      this.startPanel.setAttribute('visible', false);
      this.engineArea.setAttribute('visible', true);
      this.tutorialPanel.setAttribute('visible', true);
      try {
        if (!this.el.is('vr-mode')) this.el.enterVR();
      } catch (e) { /* desktop fallback is fine */ }
      this.activateStep(0);
    },

    onExit: function () {
      this.setPanelMessage(this.startPanel, 'THANKS FOR VISITING', 'You can remove the headset or close this tab now.');
      this.showPanelButtons(this.startPanel, false);
      try { window.close(); } catch (e) { /* ignore */ }
    },

    onRestart: function () {
      this.showPanelButtons(this.completionPanel, false);
      this.completionPanel.setAttribute('visible', false);
      PARTS.forEach(function (p) {
        p.el.object3D.position.copy(p.trayVec);
        p.el.object3D.quaternion.set(0, 0, 0, 1);
        p.el.dataset.locked = 'false';
        p.el.dataset.active = 'false';
        p.el.classList.remove('interactive');
        p.el.removeAttribute('animation__pulse');
        p.el.setAttribute('scale', '1 1 1');
        p.el.setAttribute('material', 'emissiveIntensity', 0);
        p.ghostEl.setAttribute('visible', false);
      });
      this.tutorialPanel.setAttribute('visible', true);
      this.activateStep(0);
    },

    onEnd: function () {
      this.setPanelMessage(this.completionPanel, 'SIMULATION ENDED', 'Great work! You can remove the headset or close this tab.');
      this.showPanelButtons(this.completionPanel, false);
      try { if (this.el.is('vr-mode')) this.el.exitVR(); } catch (e) { /* ignore */ }
      try { window.close(); } catch (e) { /* ignore */ }
    },

    // ---------------- panel helpers ----------------
    showPanelButtons: function (panelEl, show) {
      var buttons = panelEl.querySelectorAll('.ui-button');
      for (var i = 0; i < buttons.length; i++) {
        if (show) buttons[i].classList.add('interactive');
        else buttons[i].classList.remove('interactive');
      }
    },

    setPanelMessage: function (panelEl, title, subtitle) {
      var t = panelEl.querySelector('.panel-title');
      var s = panelEl.querySelector('.panel-subtitle');
      if (t) t.setAttribute('value', title);
      if (s) s.setAttribute('value', subtitle);
    }
  });
})();
</script>
</body>
</html>
